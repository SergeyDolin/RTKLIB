# RTK/PPK relative positioning profile for an Android L1/L5 rover.
# The reference receiver must provide matching L1 and L5/E5a/B2a signals.

pos1-posmode       =kinematic
pos1-frequency     =l1+l5
pos1-soltype       =forward
pos1-elmask        =15
pos1-dynamics      =on
pos1-ionoopt       =off
pos1-tropopt       =saas
pos1-navsys        =45          # GPS + Galileo + BeiDou

pos2-armode        =continuous  # avoid holding a smartphone false fix
pos2-gloarmode     =off
pos2-bdsarmode     =on
pos2-arfilter      =on
pos2-arthres       =3.5
pos2-arlockcnt     =5
pos2-arelmask      =15
pos2-arminfix      =20
pos2-aroutcnt      =5
pos2-slipthres     =0.10
pos2-rejionno      =30
pos2-niter         =2

# L1 code is substantially noisier than L5 code on typical phones. In the
# logical L1/L5 mode eratio1 and eratio2 correspond to L1 and L5 respectively.
stats-eratio1      =300
stats-eratio2      =100
stats-errphase     =0.005
stats-errphaseel   =0.005
stats-errdoppler   =1.0
stats-stdbias      =30
stats-prnbias      =0.01

out-outsingle      =on
out-outstat        =residual
